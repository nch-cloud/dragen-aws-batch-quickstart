AWSTemplateFormatVersion: 2010-09-09

Description: Sets up your AWS Batch Environment for running DRAGEN. (qs-1s1d8j1gr)

Metadata:
  cfn-lint: { config: { ignore_checks: [W9006, W9002, W9003, E3008] } }
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: DRAGEN parameteres
        Parameters:
        - GenomicsS3Bucket
        - DragenDockerImage
      - Label:
          default: AWS Batch Compute Environment Configuration
        Parameters:
        - VpcId
        - SubnetIds
        - BidPercentage
        - ImageId
        - Ec2KeyPair
        - MinvCpus
        - MaxvCpus
        - DesiredvCpus
        - InstanceType
        - RetryNumber
    ParameterLabels:
      GenomicsS3Bucket:
        default: Genomics Data Bucket
      RetryNumber:
        default: AWS Batch Retry Number
      DragenDockerImage:
        default: Dragen Docker Image
      VpcId:
        default: VPC ID
      SubnetIds:
        default: Subnet Ids
      ImageId:
        default: Image Id
      Ec2KeyPair:
        default: Key Pair
      InstanceType:
        default: Instance Type
      BidPercentage:
        default: Spot Bid Percentage
      MinvCpus:
        default: Min vCPUs
      MaxvCpus:
        default: Max vCPUs
      DesiredvCpus:
        default: Desired vCPUs


Parameters:
  GenomicsS3Bucket:
    AllowedPattern: ^[0-9a-zA-Z]+([0-9a-zA-Z-]*[0-9a-zA-Z])*$
    ConstraintDescription: S3 genomics bucket name can include numbers, lowercase
      letters, uppercase letters, and hyphens (-). It cannot start or end with a hyphen
      (-).
    Description: S3 bucket name for the bucket to which you'll read and write genomics data. 
    Type: String
  DragenDockerImage:
    Type: String
    Description: Path to DRAGEN docker image repository URI.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VpcId containing each of the SubnetIds
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets you want your batch compute environment to launch in. Must be private subnets and in the VPC specified by VpcId.
  BidPercentage:
    AllowedPattern: (?:\b|-)([1-9]{1,2}[0]?|100)\b
    ConstraintDescription: Spot Bid Percentage should be between 1 and 100, inclusive
    Description: The bid percentage set for your AWS Batch Managed Compute Environment with Spot Instances.
    Type: String
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: AMI you want your AWS Batch Managed Compute Environment to use
  Ec2KeyPair:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Amazon EC2 Key Pair for EC2 instances launched in your compute environment
  MinvCpus:
    Type: String
    Description: Minimum number of CPUs in the compute environment. Default 0.
    Default: 0
    AllowedPattern: "[0-9]+"
  DesiredvCpus:
    Type: String
    Description: Desired number of CPUs in the compute environment to launch with. Default 0.
    Default: 0
    AllowedPattern: "[0-9]+"
  MaxvCpus:
    Type: String
    Description: Maximum number of CPUs in the compute environment. Should be >= than MinCpus
    AllowedPattern: "[0-9]+"
  RetryNumber:
    Type: String
    Default: "1"
    Description: Number of retries for each AWS Batch job. Integer required.
    MaxLength: 1
    AllowedPattern: (?:\b|-)([1-9]|10)\b
    ConstraintDescription: Value between 1 and 10
  InstanceType:
    AllowedValues:
    - f2.6xlarge
    - f2.12xlarge
    Description: Amazon EC2 instance type for DRAGEN in the AWS Batch Compute Environment.
    Type: String

Conditions:
  Is6xl: !Equals [!Ref InstanceType, 'f2.6xlarge']
  Is12xl: !Equals [!Ref InstanceType, 'f2.12xlarge']

Resources:
  # Batch Setup
  BatchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow https, http, dns, and ntp
      VpcId: !Ref VpcId
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0
      - IpProtocol: udp
        FromPort: 53
        ToPort: 53
        CidrIp: 0.0.0.0/0
      - IpProtocol: udp
        FromPort: 123
        ToPort: 123
        CidrIp: 0.0.0.0/0
  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - "batch.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
      - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBatchServiceRole
  SpotFleetRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - "spotfleet.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
      - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonEC2SpotFleetTaggingRole"
  S3ReadWritePolicyInstance:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: S3ReadWritePolicyInstance
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: S3ReadWritePolicyInstance
            Effect: Allow
            Action:
            - "s3:GetBucketLocation"
            - "s3:ListBucket"
            - "s3:ListBucketVersions"
            - "s3:GetObject"
            - "s3:GetObjectVersion"
            - "s3:PutObject"
            - "s3:ListMultipartUploadParts"
            - "s3:AbortMultipartUpload"
            Resource:
            - !Sub "arn:${AWS::Partition}:s3:::${GenomicsS3Bucket}"
            - !Sub "arn:${AWS::Partition}:s3:::${GenomicsS3Bucket}/*"
      Roles:
      - !Ref DragenInstanceRole
  S3ReadWritePolicyJob:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: S3ReadWritePolicyJob
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: S3ReadWritePolicyJob
            Effect: Allow
            Action:
            - "s3:GetBucketLocation"
            - "s3:ListBucket"
            - "s3:ListBucketVersions"
            - "s3:GetObject"
            - "s3:GetObjectVersion"
            - "s3:PutObject"
            - "s3:ListMultipartUploadParts"
            - "s3:AbortMultipartUpload"
            Resource:
            - !Sub "arn:${AWS::Partition}:s3:::${GenomicsS3Bucket}"
            - !Sub "arn:${AWS::Partition}:s3:::${GenomicsS3Bucket}/*"
      Roles:
      - !Ref DragenJobRole
  DragenLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        InstanceType: !Ref 'InstanceType'
        ImageId: !Ref 'ImageId'
        SecurityGroupIds:
          - !Ref BatchSecurityGroup
        IamInstanceProfile:
          Name: !Ref 'DragenInstanceProfile'
        KeyName: !Ref 'Ec2KeyPair'
        TagSpecifications:
          -
            ResourceType: 'instance'
            Tags:
              - Key: "Name"
                Value: "Dragen"
        UserData:
          !Base64 |
            MIME-Version: 1.0
            Content-Type: multipart/mixed; boundary="==MYBOUNDARY=="

            --==MYBOUNDARY==
            Content-Type: text/x-shellscript; charset="us-ascii"

            #!/bin/bash
            yum install -y https://s3.amazonaws.com/ec2-downloads-windows/SSMAgent/latest/linux_amd64/amazon-ssm-agent.rpm
            start amazon-ssm-agent
            curl -o /home/ec2-user/amazon-cloudwatch-agent.rpm https://s3.amazonaws.com/amazoncloudwatch-agent/amazon_linux/amd64/latest/amazon-cloudwatch-agent.rpm
            rpm -i /home/ec2-user/amazon-cloudwatch-agent.rpm
            /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c ssm:AmazonCloudWatch-EC2-Churchill-Logging -s

            --==MYBOUNDARY==--
  DragenComputeEnvironmentSpot:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: dragen-spot
      ServiceRole: !Ref BatchServiceRole
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        BidPercentage: !Ref BidPercentage
        Ec2KeyPair: !Ref Ec2KeyPair
        ImageId: !Ref ImageId
        InstanceRole: !Ref DragenInstanceRole
        InstanceTypes: [!Ref InstanceType]
        MinvCpus: !Ref MinvCpus
        DesiredvCpus: !Ref DesiredvCpus
        MaxvCpus: !Ref MaxvCpus
        SecurityGroupIds:
        - !Ref BatchSecurityGroup
        SpotIamFleetRole: !Ref SpotFleetRole
        Subnets: !Ref SubnetIds
        Type: SPOT
        LaunchTemplate:
          LaunchTemplateId: !Ref DragenLaunchTemplate
  DragenComputeEnvironmentOnDemand:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: dragen-ondemand
      ServiceRole: !Ref BatchServiceRole
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Ec2KeyPair: !Ref Ec2KeyPair
        ImageId: !Ref ImageId
        InstanceRole: !Ref DragenInstanceRole
        InstanceTypes: [!Ref InstanceType]
        MinvCpus: !Ref MinvCpus
        DesiredvCpus: !Ref DesiredvCpus
        MaxvCpus: !Ref MaxvCpus
        SecurityGroupIds:
        - !Ref BatchSecurityGroup
        Subnets: !Ref SubnetIds
        Type: EC2
        LaunchTemplate:
          LaunchTemplateId: !Ref DragenLaunchTemplate

  # DRAGEN set up
  DragenJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - "ecs-tasks.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
      - arn:aws:iam::257995316808:policy/shared-acct-s3-read-clinical
      - arn:aws:iam::257995316808:policy/shared-acct-s3-read-research
      - arn:aws:iam::257995316808:policy/shared-acct-s3-write-clinical
      - arn:aws:iam::257995316808:policy/shared-acct-s3-write-research              
  DragenInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - "ec2.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
      - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
      - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      - arn:aws:iam::257995316808:policy/shared-acct-s3-read-clinical
      - arn:aws:iam::257995316808:policy/shared-acct-s3-read-research
      - arn:aws:iam::257995316808:policy/shared-acct-s3-write-clinical
      - arn:aws:iam::257995316808:policy/shared-acct-s3-write-research
  DragenInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
      - !Ref DragenInstanceRole
      InstanceProfileName: !Ref DragenInstanceRole
  DragenJobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: dragen-queue
      Priority: 100
      State: ENABLED
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref DragenComputeEnvironmentOnDemand
        - Order: 2
          ComputeEnvironment: !Ref DragenComputeEnvironmentSpot
  DragenJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: dragen
      Type: container
      RetryStrategy:
        Attempts: !Ref RetryNumber
      ContainerProperties:
        Image: !Ref DragenDockerImage
        Vcpus: !If [Is6xl, 24, 48]
        Memory: !If [Is6xl, 240000, 480000]
        JobRoleArn: !GetAtt DragenJobRole.Arn
        MountPoints:
          - ContainerPath: "/scratch"
            ReadOnly: False
            SourceVolume: docker_scratch
          - ContainerPath: "/ephemeral"
            ReadOnly: False
            SourceVolume: docker_ephemeral
          - ContainerPath: "/opt/edico"
            ReadOnly: False
            SourceVolume: docker_opt_edico
          - ContainerPath: "/var/lib/edico"
            ReadOnly: False
            SourceVolume: docker_var_lib_edico
          - ContainerPath: "/usr/lib64/libdragen.so.4.4.4"
            ReadOnly: False
            SourceVolume: docker_usr_lib64
        Volumes:
          - Name: docker_scratch
            Host:
              SourcePath: "/scratch"
          - Name: docker_ephemeral
            Host:
              SourcePath: "/ephemeral"
          - Name: docker_opt_edico
            Host:
              SourcePath: "/opt/edico"
          - Name: docker_var_lib_edico
            Host:
              SourcePath: "/var/lib/edico"
          - Name: docker_usr_lib64
            Host:
              SourcePath: "/usr/lib64/libdragen.so.4.4.4"

Outputs:
  DragenComputeEnvironmentSpot:
    Value: !Ref DragenComputeEnvironmentSpot
  DragenComputeEnvironmentOnDemand:
    Value: !Ref DragenComputeEnvironmentOnDemand
  JobQueue:
    Value: !Ref DragenJobQueue
  DragenJobDefinition:
    Value: !Ref DragenJobDefinition
